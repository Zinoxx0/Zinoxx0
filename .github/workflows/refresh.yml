# Redraws the profile's images every day from live GitHub data and today's sky over Lisbon.
# They go to the output branch as a single commit, so main's history stays readable. If anything
# fails, nothing is published and yesterday's images stay up.
name: refresh

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: ["gen/**", ".github/workflows/refresh.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BOT: -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: python3 -m unittest discover -s tests

      - name: Draw
        run: python3 gen/build.py

      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git add .
          git $BOT commit -q -m "Redraw the profile images"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without repository activity
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git $BOT commit -q --allow-empty -m "Keep the daily refresh running"
            git push -q origin HEAD:main
          fi
